<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="x-ua-compatible" content="ie=edge">
        <title>{{ .Title }} | Gabriel Durazo</title>
        <meta name="description" content="The personal web site of Gabe Durazo. Contact information, and blog posts mostly about tech and travel">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            html{font-family:Georgia,Times,serif; font-size:18px;}
            pre,code{font-family: monaco, 'Consolas', monospace;}
            body{padding:0;margin:0;}
            p{font-size:1.0rem; line-height:1.6rem; margin-top:0px; margin-bottom:1rem;}
            ul{padding-left:0rem;list-style-type: none}
            li{line-height:1rem;margin-bottom:0.6rem;padding:0;}
            a{text-decoration: none;}

            .home-about{background-color: #def; margin:0; padding:15px;}
            .home-about h1{margin-top:0;}
            .home-content{margin:0; padding:15px;}

            @media(min-width:700px){
                h1{font-size:3.0rem; line-height:3.0rem; margin-bottom:1.5rem; margin-top:0.5rem;}
                h2{font-size:1.8rem; line-height:2.0rem; margin-bottom:1.0rem; margin-top:2.0rem;}
                h3{font-size:1.2rem; line-height:1.2rem; margin-bottom:0.8rem; margin-top:2.0rem;}
                h4,h5,h6,h7{font-size:1rem;line-height:1rem;margin:0;}
            }

            @media(min-width:900px){
                .constrain-width{max-width:900px;margin:0 auto;}
            }
        </style>
    </head>
    <body>
        <div class="home-container">
            <section class="home-about">
                <div class="constrain-width">
                    <h1>{{ .Title }}</h1>
                    <p><a href="/">← Back to home</a></p>
                </div>
            </section>
            <section class="home-content">
                <div class="constrain-width">
                    <ul>
                        {{ range .Pages }}
                            <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
                        {{ end }}
                    </ul>
                </div>
            </section>
        </div>
    </body>
</html>
